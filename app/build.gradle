plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universal.deviceinfo'
    compileSdk 35

    defaultConfig {
        applicationId "com.universal.deviceinfo"
        // minSdk 14 (Android 4.0 Ice Cream Sandwich): about as low as modern
        // AGP/aapt2 will build, so the APK installs on essentially every Android
        // device ever shipped in real-world use. Every API newer than 14 is
        // called behind an explicit Build.VERSION.SDK_INT guard (and each info
        // section is wrapped in try/catch), so old devices simply show fewer
        // fields instead of crashing. Zero native code -> one APK runs on ALL
        // CPU architectures (arm, arm64, x86, x86_64, ...).
        minSdk 14
        // targetSdk 29 (Android 10) is deliberate for a SIDELOADED (non–Play
        // Store) app: it keeps legacy external-storage write behaviour on
        // Android <= 10 and keeps full "list all installed packages" visibility
        // on every version, both of which serve the "show everything" goal.
        targetSdk 29
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        debug {
            // Debug APK is auto-signed with the Android debug keystore, so it is
            // directly installable (sideload) on any device with no extra setup.
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Java 8 language level: broad compatibility, no desugaring needed for
        // the framework-only APIs used here.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // The app intentionally calls many APIs above minSdk behind SDK_INT guards.
    // Do not fail the build on NewApi/lint; the guards make those calls safe.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // No external dependencies on purpose (pure Android framework), so nothing
    // to package beyond our own classes.
}
