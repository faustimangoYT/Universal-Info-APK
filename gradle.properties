# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
# This project deliberately uses ZERO AndroidX / support libraries so the APK
# runs on the widest possible range of Android versions with no transitive
# minSdk floor. Keep AndroidX disabled.
android.useAndroidX=false
android.enableJetifier=false
# Non-transitive R class keeps the generated R small.
android.nonTransitiveRClass=true
